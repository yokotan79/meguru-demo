<title>MEGURU 配車システム</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* Layout: 藍のヘッダー帯の下に、オペレーターは2カラム(受付|依頼一覧)、運転手はスマホ幅1カラム+下タブ */
:root{
  --paper:#EEF0E6; --panel:#E3E6D8; --card:#FBFBF8; --ink:#1A2233; --ink-soft:#4B5266;
  --indigo:#16213F; --indigo-2:#223058; --on-indigo:#EEF0E6; --on-indigo-soft:#9DA8C6;
  --gold:#C79A3E; --gold-ink:#8C6A24; --gold-bg:#F7F1E3; --on-gold:#251C08;
  --teal:#3E6B5C; --teal-ink:#294A3F; --teal-bg:#E1E9E1;
  --red:#B84A3E; --red-bg:#F3E4E1; --line:rgba(26,34,51,.14); --focus:#C79A3E;
  --c-solo:#16805E; --c-share:#B07D1E; --grid:rgba(26,34,51,.10); --map-bg:#E9ECE0;
  --f-display:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --f-data:'DotGothic16','Osaka-Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121725; --panel:#1A2133; --card:#1E263A; --ink:#E6E8DF; --ink-soft:#A3AABB;
  --indigo:#0B1020; --indigo-2:#26335A; --on-indigo:#E6E8DF; --on-indigo-soft:#8E99B8;
  --gold:#D4AA55; --gold-ink:#E0BD72; --gold-bg:#2F2818; --on-gold:#1E1606;
  --teal:#5C9A84; --teal-ink:#8CC4AE; --teal-bg:#1D3029;
  --red:#E07A6E; --red-bg:#3A2124; --line:rgba(230,232,223,.14); color-scheme:dark;
  --c-solo:#35A27C; --c-share:#B8862C; --grid:rgba(230,232,223,.10); --map-bg:#182032;
}}
:root[data-theme="dark"]{
  --paper:#121725; --panel:#1A2133; --card:#1E263A; --ink:#E6E8DF; --ink-soft:#A3AABB;
  --indigo:#0B1020; --indigo-2:#26335A; --on-indigo:#E6E8DF; --on-indigo-soft:#8E99B8;
  --gold:#D4AA55; --gold-ink:#E0BD72; --gold-bg:#2F2818; --on-gold:#1E1606;
  --teal:#5C9A84; --teal-ink:#8CC4AE; --teal-bg:#1D3029;
  --red:#E07A6E; --red-bg:#3A2124; --line:rgba(230,232,223,.14); color-scheme:dark;
  --c-solo:#35A27C; --c-share:#B8862C; --grid:rgba(230,232,223,.10); --map-bg:#182032;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--indigo)}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:18px}
h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* header */
.top{background:var(--indigo);color:var(--on-indigo);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
.brand{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:.04em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--on-indigo-soft);letter-spacing:.08em}
.beta{font-family:var(--f-data);font-size:11px;font-weight:400;letter-spacing:.08em;color:var(--on-gold);background:var(--gold);padding:1px 7px;border-radius:4px;align-self:center}
.guide{background:var(--card);border:1px solid var(--gold);border-radius:8px;padding:14px 16px;margin-bottom:16px;display:grid;gap:8px}
.guide-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.guide-h h2{font-size:16px;margin-right:auto}
.guide ol{margin:0;padding-left:0;list-style:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;counter-reset:g}
@media (max-width:980px){.guide ol{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.guide ol{grid-template-columns:minmax(0,1fr)}}
.guide li{counter-increment:g;background:var(--paper);border-radius:6px;padding:10px 12px;font-size:13px;display:grid;gap:6px;align-content:start}
.guide li::before{content:counter(g);font-family:var(--f-data);color:var(--gold-ink);font-size:12px}
.guide li.done{opacity:.55}
.guide li .btn{justify-self:start}
.map-card{padding:12px 14px}
.map-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.map-h h3{margin-right:auto}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
.vchips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.map{width:100%;height:auto;display:block;background:var(--map-bg);border-radius:6px}
.map .pt{fill:var(--ink-soft)}
.map .pt.base{fill:var(--card);stroke:var(--ink-soft);stroke-width:1.5}
.map .lbl{font-size:11px;fill:var(--ink-soft);font-family:var(--f-body)}
.map .lbl.on{fill:var(--ink);font-weight:700;paint-order:stroke;stroke:var(--map-bg);stroke-width:3px;stroke-linejoin:round}
.map .past{stroke:var(--ink-soft);stroke-opacity:.35;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.map .next{stroke:var(--c-solo);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.map .stopn{fill:var(--c-solo);stroke:var(--map-bg);stroke-width:2}
.map .stopt{font-size:10px;fill:#fff;font-family:var(--f-data);text-anchor:middle;dominant-baseline:central}
.map .req{fill:none;stroke:var(--c-share);stroke-width:2.5}
.map .reqline{stroke:var(--c-share);stroke-width:2;stroke-dasharray:4 4;fill:none}
.map-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--ink-soft);margin-top:6px}
.map-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 400px;align-items:start}
.split-main{min-width:0}
.split-phone{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);padding:16px 16px 16px 0;max-height:calc(100vh - 64px);overflow-y:auto}
.phone.embedded{min-height:0;border:10px solid var(--indigo);border-radius:28px;overflow:hidden;background:var(--paper)}
.phone.embedded .dbody{padding:12px 12px}
.phone.embedded .dhead{border-radius:0}
.tour{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100vw - 32px));background:var(--indigo);color:var(--on-indigo);border-radius:12px;padding:16px 18px;z-index:30;display:grid;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,.3)}
.tour p{font-size:15px;line-height:1.7}
.tour-h{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--gold)}
.tour-bar{flex:1;height:4px;background:var(--indigo-2);border-radius:2px;overflow:hidden}
.tour-bar i{display:block;height:100%;background:var(--gold)}
.tour .btn-ghost{color:var(--on-indigo);border-color:var(--on-indigo-soft)}
.toast.up{bottom:calc(200px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){.tour-bar i{transition:width .4s}}
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 12px}
@media (max-width:760px){.presets{grid-template-columns:minmax(0,1fr)}}
.presets button{display:grid;gap:4px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.presets button[aria-checked="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);background:var(--gold-bg)}
.presets b{font-size:14px}
.presets span{font-size:12px;color:var(--ink-soft);line-height:1.5}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
@media (max-width:860px){.charts{grid-template-columns:minmax(0,1fr)}}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{font-size:11px;fill:var(--ink-soft);font-family:var(--f-body)}
.chart .val{font-size:12px;fill:var(--ink);font-family:var(--f-data)}
.chart .ref{stroke:var(--ink-soft);stroke-width:1}
.chart .ln{stroke:var(--c-solo);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--c-solo);fill-opacity:.1}
.chart .dot{fill:var(--c-solo);stroke:var(--card);stroke-width:2}
.chart .b-solo{fill:var(--c-solo)}
.chart .b-share{fill:var(--c-share)}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:var(--grid)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-soft);margin:-4px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.roles{display:flex;gap:4px;background:var(--indigo-2);padding:3px;border-radius:8px}
.roles button{background:transparent;border:0;color:var(--on-indigo-soft);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.roles button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);font-weight:700}
.conn{margin-left:auto;font-size:12px;color:var(--on-indigo-soft);display:flex;align-items:center;gap:6px}
.conn i{width:8px;height:8px;border-radius:50%;background:#6DBB9C;display:inline-block}
.conn.demo i{background:var(--gold)}
.conn.warn i{background:var(--red)}

.wrap{max-width:1280px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;color:var(--ink-soft);white-space:nowrap}
.subtabs button[aria-pressed="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--gold)}

.board{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.board{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card > h2,.card > h3{margin-bottom:10px}
.hint{font-size:12px;color:var(--ink-soft)}
.quote{background:var(--gold-bg);color:var(--gold-ink);font-size:12.5px;padding:8px 10px;border-radius:6px;margin-bottom:12px}

form.f{display:grid;gap:10px}
.f label{display:grid;gap:4px;font-size:12px;color:var(--ink-soft)}
.f input:not([type=checkbox]),.f select,.f textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-size:14px;color:var(--ink);min-width:0}
.f .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);padding-top:18px}
.f .chk input{width:18px;height:18px;accent-color:var(--teal)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.g3{grid-template-columns:1fr 1fr}}
.riderbox{background:var(--panel);border-radius:6px;padding:8px 10px;font-size:12.5px;display:grid;gap:2px}
.err{color:var(--red);font-size:12.5px}

.btn{border:1px solid transparent;cursor:pointer;border-radius:6px;padding:10px 14px;font-size:14px;line-height:1.3;background:var(--panel);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-gold{background:var(--gold);color:var(--on-gold);font-weight:700}
.btn-teal{background:var(--teal);color:#fff;font-weight:700}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-red{background:transparent;border-color:var(--red);color:var(--red)}
.btn-sm{padding:6px 10px;font-size:12.5px}
.btn-block{width:100%}
.btn-big{padding:16px;font-size:16px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--panel);color:var(--ink-soft);white-space:nowrap}
.pill.p-new,.pill.p-declined,.pill.p-noshow{background:var(--red-bg);color:var(--red)}
.pill.p-offered{background:var(--gold-bg);color:var(--gold-ink)}
.pill.p-accepted,.pill.p-onboard{background:var(--teal-bg);color:var(--teal-ink)}
.pill.p-shared{background:var(--indigo-2);color:var(--on-indigo)}
.pill.p-sample{background:transparent;border:1px dashed var(--line)}

.listhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.listhead h2{margin-right:auto}
.listhead input[type=date]{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.chips{display:flex;gap:6px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.reqs{display:grid;gap:10px}
.req{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.req.need{border-left-color:var(--red)}
.req.wait{border-left-color:var(--gold)}
.req.ok{border-left-color:var(--teal)}
.req.fade{opacity:.62}
.req-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.req-h .t{font-family:var(--f-data);font-size:20px;line-height:1}
.req-h .who{font-weight:700}
.req .route{font-size:13.5px}
.req .meta{font-size:12px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 12px}
.care{background:var(--red-bg);color:var(--red);font-size:12px;padding:5px 9px;border-radius:4px}

.cands{border-top:1px dashed var(--line);margin-top:4px;padding-top:10px;display:grid;gap:8px}
.cands-h{font-size:12px;color:var(--ink-soft)}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px}
.cand .rank{font-family:var(--f-data);color:var(--gold-ink);font-size:12px}
.cand .add{font-family:var(--f-data);font-size:18px;color:var(--ink)}
.cand .sub{font-size:12px;color:var(--ink-soft)}
.cand .act{grid-column:1/-1}
details.ex{font-size:12.5px;color:var(--ink-soft)}
details.ex li{margin:2px 0}

.vlist{display:grid;gap:8px}
.vrow{display:flex;align-items:center;gap:10px;font-size:13px}
.vrow b{flex:1;min-width:0}
.seats{display:flex;gap:4px}
.seat{width:16px;height:16px;border-radius:3px;border:1px solid var(--line);background:var(--paper)}
.seat.on{background:var(--teal);border-color:var(--teal)}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile .v{font-family:var(--f-data);font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--ink-soft)}
.tile .s{font-size:11px;color:var(--ink-soft);opacity:.85;margin-top:2px;line-height:1.5}
.tile.key .s{color:var(--on-indigo-soft)}
.kpi-say{font-size:15px;line-height:1.9;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:0 0 14px}
.tile.key{background:var(--indigo);border-color:var(--indigo)}
.tile.key .v{color:var(--gold)}
.tile.key .l{color:var(--on-indigo-soft)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--ink-soft);font-weight:500;letter-spacing:.04em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.formula{font-size:12px;color:var(--ink-soft);background:var(--panel);border-radius:6px;padding:10px 12px;margin-top:12px}
textarea.csv{width:100%;height:160px;font-family:var(--f-data);font-size:11px;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:8px}

.empty{color:var(--ink-soft);font-size:13px;text-align:center;padding:24px 8px}
.notice{background:var(--gold-bg);color:var(--gold-ink);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px}

/* driver */
.phone{max-width:440px;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;min-height:calc(100vh - 140px)}
.dhead{background:var(--indigo);color:var(--on-indigo);padding:14px 18px 18px;border-radius:0 0 14px 14px}
.dhead .who{font-size:12px;color:var(--on-indigo-soft);display:flex;justify-content:space-between}
.dhead .who button{background:none;border:0;color:var(--on-indigo-soft);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
.dhead .veh{font-family:var(--f-display);font-size:20px;margin-top:2px}
.toggle{margin-top:10px;display:inline-flex;align-items:center;gap:8px;font-size:13px;background:var(--indigo-2);color:var(--on-indigo);padding:6px 12px;border-radius:14px;border:0;cursor:pointer}
.toggle i{width:9px;height:9px;border-radius:50%;background:#6DBB9C;display:inline-block}
.toggle.off i{background:var(--red)}
.dbody{flex:1;padding:16px 4px;display:grid;gap:12px;align-content:start}
.alert{background:var(--gold-bg);border:1px solid var(--gold);border-radius:8px;padding:14px;display:grid;gap:4px}
.alert .tag{font-family:var(--f-data);font-size:11px;color:var(--gold-ink)}
.alert .time{font-size:22px;font-weight:700}
.alert.ok{background:var(--teal-bg);border-color:var(--teal)}
.alert.ok .tag{color:var(--teal-ink)}
.kv{display:flex;gap:8px;font-size:13.5px}
.kv .k{color:var(--ink-soft);width:64px;flex-shrink:0}
.dbtns{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-top:10px}
.sec{font-family:var(--f-data);font-size:12px;color:var(--ink-soft);margin-top:6px}
.stop{display:flex;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.stop .n{width:26px;height:26px;border-radius:50%;background:var(--indigo-2);color:var(--on-indigo);font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--f-data)}
.stop.done{opacity:.5}
.stop.next{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.stop .t{font-size:14px}
.stop .s{font-size:12px;color:var(--ink-soft)}
.big-next{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:8px}
.big-next .what{font-family:var(--f-data);font-size:12px;color:var(--gold-ink)}
.big-next .place{font-family:var(--f-display);font-size:22px}
.phonebox{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:8px;padding:10px 12px}
.phonebox .num{font-family:var(--f-data);font-size:18px;flex:1;user-select:all}
.dtabs{position:sticky;bottom:0;display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}

      const r = riders[x.rid], id = `q_${date.replace(/-/g, '')}_${pad(i)}`;
      const created = at(addDays(date, -1), 540 + 5 * Math.floor(rnd() * 100));
      const req = {
        id, riderId: x.rid, riderNo: r.no, date, pickupTime: fromMin(x.t), pickupPlaceId: x.from, pickupLabel: places[x.from].name,
        pickupDetail: x.from === r.homePlaceId ? r.homeDetail : '正面玄関', destPlaceId: x.to, destLabel: places[x.to].name,
        party: rnd() < 0.1 ? 2 : 1, care: r.care, wheelchair: r.wheelchair, status: 'new', vehicleId: null, offers: [], ev: {},
        riderNotified: false, createdAt: created, sample: true, log: [{ at: created, by: null, act: '電話受付' }],
      };
      S.requests[id] = req;
      const c = candidates(req);
      if (!c.ok.length) { req.status = 'taxi'; req.log.push({ at: created, by: null, act: 'タクシー手配' }); return; }
      let ch = c.ok[0];
      if (rnd() < 0.12 && c.ok.length > 1) {
        req.offers.push({ vehicleId: ch.v.id, at: created, result: 'declined', reason: pick(REASONS) });
        req.log.push({ at: created, by: null, act: `依頼: ${ch.v.name}` }, { at: created, by: null, act: `辞退: ${ch.v.name}` });
        ch = c.ok[1];
      }
      req.offers.push({ vehicleId: ch.v.id, at: created, result: 'accepted' });
      req.log.push({ at: created, by: null, act: `依頼: ${ch.v.name}` }, { at: created, by: null, act: '配車確定' });
      Object.assign(req, { status: 'accepted', vehicleId: ch.v.id, estAddMin: ch.added, estDropMin: ch.dropAt, shared: ch.shared, riderNotified: true, ev: { acceptedAt: created } });
    });
    // 各車両の停車順を走らせて、実際のお迎え・降車時刻を決める
    for (const v of Object.values(S.vehicles)) {
      const route = routeOf(v, date), sim = simulate(route, route.seq);
      for (const id in sim.info) {
        const r = S.requests[id], i = sim.info[id];
        r.estDropMin = i.drop;
        const fin = !isToday || i.drop <= DEMO_NOW, riding = isToday && i.pick <= DEMO_NOW && i.drop > DEMO_NOW;
        if (fin || riding) Object.assign(r.ev, { arrivedAt: at(date, i.pick - 1), boardedAt: at(date, i.pick) });
        if (fin) {
          r.ev.droppedAt = at(date, i.drop); r.status = 'done'; r.log.push({ at: r.ev.droppedAt, by: null, act: '完了' });
          if (!isToday && rnd() < 0.4) {
            const s = rnd();
            surveys[id] = { requestId: id, riderId: r.riderId, date, satisfaction: s < 0.45 ? 5 : s < 0.85 ? 4 : s < 0.97 ? 3 : 2,
              easier: rnd() < 0.72 ? 'yes' : rnd() < 0.85 ? 'same' : 'no', comment: pick(COMMENTS), at: at(date, i.drop + 120), sample: true };
          }
        } else if (riding) { r.status = 'onboard'; r.log.push({ at: r.ev.boardedAt, by: null, act: '乗車中' }); }

    }
  }
  // 導入前の座席稼働率(架空): 比較機能を見せるための値。デモの過去分の稼働率の約3/4とする
  const hist = kpi(Object.values(S.requests).filter(r => r.date !== today)).perV;
  for (const vid in vehicles) { const p = hist[vid]; vehicles[vid].baselineOcc = p && p.cap ? Math.round(p.used / p.cap * 750) / 10 : 10; }
  // 今日: 午後の1件を「すみれ苑の返答待ち」に、新しい電話を2件「未配車」にする(体験の入口)
  const todays = Object.values(S.requests).filter(r => r.date === today);
  const later = todays.filter(r => r.status === 'accepted' && r.vehicleId === pr.demo.offer && toMin(r.pickupTime) >= 660);
  const off = later[0] || todays.find(r => r.status === 'accepted' && toMin(r.pickupTime) >= 660);
  if (off) {
    off.status = 'offered'; off.riderNotified = false; off.ev = {};
    off.offers = [...off.offers.slice(0, -1), { vehicleId: off.vehicleId, at: at(today, 585), result: 'pending' }];
    off.log = off.log.filter(l => l.act !== '配車確定');
  }
  const nw = (id, rid, to, t, extra) => {
    const r = riders[rid];
    S.requests[id] = { id, riderId: rid, riderNo: r.no, date: today, pickupTime: t, pickupPlaceId: r.homePlaceId, pickupLabel: places[r.homePlaceId].name,
      pickupDetail: r.homeDetail, destPlaceId: to, destLabel: places[to].name, party: 1, care: r.care, wheelchair: r.wheelchair,
      status: 'new', vehicleId: null, offers: [], ev: {}, riderNotified: false, createdAt: at(today, 590), sample: true,
      log: [{ at: at(today, 590), by: null, act: '電話受付' }], ...extra };
  };
  nw('q_demo_a', ...pr.demo.a);
  nw('q_demo_b', ...pr.demo.b);
  const strip = o => Object.fromEntries(Object.entries(o).map(([id, d]) => { const { id: _, ...rest } = d; return [id, rest]; }));
  const out = { places, vehicles, riders, requests: strip(S.requests), surveys, settings: { main: { ...DEF, ...pr.settings, operatorPhone: '0000-00-0000', taxiPhone: '0000-11-1111', demoPreset: preset } } };
  Object.assign(S, saved);
  return out;
}

/* ============ 所要時間の概算 ============ */
function travelMin(a, b) {
  const A = S.places[a], B = S.places[b];
  if (!A || !B || a === b) return 0;
  const rad = x => x * Math.PI / 180, c = cfg();
  const h = Math.sin(rad(B.lat - A.lat) / 2) ** 2 + Math.cos(rad(A.lat)) * Math.cos(rad(B.lat)) * Math.sin(rad(B.lng - A.lng) / 2) ** 2;
  const km = 2 * 6371 * Math.asin(Math.sqrt(h)) * c.roadFactor;
  return Math.max(1, Math.ceil(km / c.speedKmh * 60));
}

/* ============ 候補車両の絞り込み ============
   車両のその日の未完了の停車順(お迎え・降車)に、新しいお迎えと降車を「どの順番で挟むか」を全通り試し、
   全員の制約(お迎えの遅れ・同乗による迂回・座席数・同時対応件数・運行時間)を満たす中で最も負担の少ない順を選ぶ。
   AIは絞り込みのみ。最終確定はオペレーターが行う(提案書 §2・§11)。 */
const ACTIVE = ['offered', 'accepted', 'onboard'];
const isoToMin = iso => { const d = new Date(iso); return d.getHours() * 60 + d.getMinutes(); };
/* 車両の出発点(最後に完了した乗降の場所と時刻)と、未完了の停車の並び */
function routeOf(v, date, skipId) {
  const c = cfg();
  const trips = Object.values(S.requests).filter(r => r.vehicleId === v.id && r.date === date && r.id !== skipId);
  let start = { t: toMin(v.hoursStart || '08:00'), place: v.basePlaceId, load: 0, conc: 0 };
  const events = [];
  trips.forEach(r => {
    if (r.status === 'done' && r.ev?.droppedAt) events.push({ t: isoToMin(r.ev.droppedAt), place: r.destPlaceId });
    if (r.status === 'onboard' && r.ev?.boardedAt) events.push({ t: isoToMin(r.ev.boardedAt), place: r.pickupPlaceId });
  });
  const last = events.sort((a, b) => a.t - b.t).pop();
  if (last) start = { ...start, t: last.t, place: last.place };
  const fixed = {}, seq = [];
  trips.filter(r => ACTIVE.includes(r.status)).forEach(r => {
    const party = +r.party || 1, direct = travelMin(r.pickupPlaceId, r.destPlaceId);
    const reqT = toMin(r.pickupTime), dropT = r.estDropMin ?? reqT + c.boardMin + direct;
    if (r.status === 'onboard') {
      start.load += party; start.conc++;
      fixed[r.id] = { pick: r.ev?.boardedAt ? isoToMin(r.ev.boardedAt) : reqT, direct };
    } else seq.push({ id: r.id, kind: 'pick', place: r.pickupPlaceId, reqT, party, direct, ord: reqT });
    seq.push({ id: r.id, kind: 'drop', place: r.destPlaceId, party, ord: dropT });
  });
  seq.sort((a, b) => a.ord - b.ord || (a.kind === 'drop' ? -1 : 1));
  return { start, seq, fixed };
}
/* 停車順を走らせて、各利用者のお迎え時刻・降車時刻・遅れ・迂回を求める */
function simulate(route, seq) {
  const c = cfg(), { start, fixed } = route;
  let t = start.t, at = start.place, load = start.load, conc = start.conc, travel = 0, maxLoad = load, maxConc = conc;
  const info = {}, trace = []; // trace: 各停車のあとの乗車人数と同時対応件数
  for (const id in fixed) info[id] = { pick: fixed[id].pick, direct: fixed[id].direct, late: 0 };
  for (const s of seq) {
    const d = travelMin(at, s.place); travel += d; t += d; at = s.place;
    const i = info[s.id] = info[s.id] || { late: 0 };
    if (s.kind === 'pick') { t = Math.max(t, s.reqT); i.pick = t; i.late = t - s.reqT; i.direct = s.direct; t += c.boardMin; load += s.party; conc++; }
    else { i.drop = t; i.extra = Math.max(0, t - i.pick - c.boardMin - i.direct); load -= s.party; conc--; }
    maxLoad = Math.max(maxLoad, load); maxConc = Math.max(maxConc, conc);
    trace.push({ id: s.id, kind: s.kind, load, conc });
  }
  return { travel, end: t, info, maxLoad, maxConc, trace };
}
function evaluate(v, req) {
  const c = cfg(), pre = [];
  if ((req.offers || []).some(o => o.vehicleId === v.id && o.result === 'declined')) pre.push('この依頼を辞退済み');
  if (v.available === false) pre.push('受付を停止中');
  if (req.wheelchair && !v.wheelchair) pre.push('車椅子に非対応');
  if (req.party > v.capacity) pre.push('定員を超える');
  const hs = toMin(v.hoursStart || '08:00'), he = toMin(v.hoursEnd || '18:00'), P = toMin(req.pickupTime);
  if (P < hs || P > he) pre.push(`運行時間外(${v.hoursStart}〜${v.hoursEnd})`);
  if (pre.length) return { v, ok: false, reasons: pre, score: Infinity };
  const route = routeOf(v, req.date, req.id), base = simulate(route, route.seq);
  const me = { id: '__new', party: +req.party || 1, direct: travelMin(req.pickupPlaceId, req.destPlaceId) };
  const pickS = { ...me, kind: 'pick', place: req.pickupPlaceId, reqT: P }, dropS = { ...me, kind: 'drop', place: req.destPlaceId };
  const n = route.seq.length;
  let best = null, nearest = null;
  for (let i = 0; i <= n; i++) {
    if (route.seq.slice(i).some(s => s.kind === 'pick' && s.reqT < P - 60)) continue; // 1時間以上前の予定より前には入れない
    for (let j = i; j <= n; j++) {
      const seq = [...route.seq.slice(0, i), pickS, ...route.seq.slice(i, j), dropS, ...route.seq.slice(j)];
      const sim = simulate(route, seq), mine = sim.info.__new, why = [];
      if (mine.late > c.lateTolMin) why.push(`お迎えが${mine.late}分遅れる見込み`);
      if (mine.extra > c.detourMaxMin) why.push(`本人の迂回が上限超え(+${mine.extra}分)`);
      // 座席と同時対応は、この方が乗っている区間(お迎え〜降車の直前)で数える
      const during = sim.trace.slice(i, j + 1);
      if (Math.max(...during.map(x => x.load)) > v.capacity) why.push('座席が足りない');
      if (Math.max(...during.map(x => x.conc)) > c.maxConcurrent) why.push(`同時対応の上限(${c.maxConcurrent}件)`);
      if (mine.drop > he) why.push(`運行時間外(${v.hoursEnd}まで)`);
      let delay = 0, shared = false;
      for (const id in base.info) {
        const a = base.info[id], b = sim.info[id];
        if (b.late > Math.max(c.lateTolMin, a.late)) why.push('他の方のお迎えが遅れる');
        if ((b.extra || 0) > Math.max(c.detourMaxMin, a.extra || 0)) why.push(`同乗者の迂回が上限超え(+${b.extra}分)`);
        if (b.drop != null && a.drop != null) delay = Math.max(delay, b.drop - a.drop);
        if (b.pick < mine.drop && (b.drop ?? Infinity) > mine.pick) shared = true;
      }
      const added = sim.travel - base.travel;
      const score = added + mine.late * 2 + delay * 0.5 + mine.extra * 0.5 - (shared ? 2 : 0);
      const r = { v, ok: !why.length, reasons: [...new Set(why)], added, pickAt: mine.pick, dropAt: mine.drop, shared, delay, score };
      if (r.ok && (!best || score < best.score)) best = r;
      if (!r.ok && (!nearest || r.reasons.length < nearest.reasons.length || (r.reasons.length === nearest.reasons.length && score < nearest.score))) nearest = r;
    }
  }
  return best || nearest || { v, ok: false, reasons: ['ルートに入れられない'], score: Infinity };
}
function candidates(req) {
  const all = Object.values(S.vehicles).map(v => evaluate(v, req));
  return { ok: all.filter(x => x.ok).sort((a, b) => a.score - b.score), ng: all.filter(x => !x.ok) };
}

/* ============ データ保存層(共有DB / デモ用メモリ) ============ */
const COLLS = ['vehicles', 'places', 'requests', 'settings', 'riders', 'surveys'];
function memStore(seed) {
  const data = {}, subs = {};
  COLLS.forEach(c => data[c] = clone(seed[c] || {}));
  const emit = c => (subs[c] || []).forEach(f => f(clone(data[c])));
  return {
    mode: 'demo',
    watch(c, cb) { (subs[c] = subs[c] || []).push(cb); setTimeout(() => cb(clone(data[c])), 0); },
    async set(c, id, d) { data[c][id] = clone(d); emit(c); },
    async update(c, id, p) { if (!data[c][id]) throw { code: 'invalid_argument', message: 'not found' }; data[c][id] = deepMerge(data[c][id], clone(p)); emit(c); },
    async del(c, id) { delete data[c][id]; emit(c); },
  };
}
function dbStore(db) {
  return {
    mode: 'live',
    watch(c, cb, err) {
      return db.collection(c).onSnapshot(s => { const o = {}; s.docs.forEach(d => o[d.id] = clone(d.data())); cb(o, s.metadata); }, e => err && err(e));
    },
    set: (c, id, d) => db.doc(c + '/' + id).set(d),
    update: (c, id, p) => db.doc(c + '/' + id).update(p),
    del: (c, id) => db.doc(c + '/' + id).delete(),
  };
}
let store = null;
const isTransient = e => !e || !e.code || e.code === 'unavailable' || e.code === 'resource_exhausted';
const errMsg = e => ({
  invalid_argument: 'この操作を行う権限がないか、入力に問題があります。',
  quota_exceeded: 'データの保存容量が上限に達しました。古い記録の整理が必要です。',
  revoked: 'このページへのアクセス権が変更されました。',
}[e && e.code] || '保存できませんでした。時間をおいてもう一度お試しください。');
async function withRetry(fn) {
  try { return await fn(); }
  catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return fn(); } throw e; }
}

/* 通信が不安定な地域向け: 運転手の記録は端末に保持し、つながり次第送信(提案書 §11) */
let queue = ls.get('meguru.queue', []);
/* 操作の記録: 依頼の状態が変わるたびに「いつ・誰が・何を」を依頼に残す(誰 = 閲覧者のid。名前は表示時に解決) */
let ME = null;
function describe(p, old) {
  if (p.status === 'offered') return `依頼: ${vName(p.vehicleId)}`;
  if (p.status === 'declined') { const o = (p.offers || []).slice(-1)[0]; return `辞退${o?.reason ? '(' + o.reason + ')' : ''}: ${vName(old?.vehicleId)}`; }
  if (p.status === 'new' && old?.status === 'offered') return '依頼を取り下げ';
  if (p.status) return (STATUS[p.status] || [p.status])[0];
  if (p.ev?.arrivedAt) return '到着';
  if (p.ev?.notifiedAt) return '利用者へ確定連絡';
  if (p.noshowChecked) return '不在を利用者に確認';
  return '';
}
const logEntry = act => ({ at: nowIso(), by: ME, act });
async function patch(c, id, p, { offline = false } = {}) {
  if (c === 'requests' && !p.log) { const act = describe(p, S[c][id]); if (act) p = { ...p, log: [...(S[c][id]?.log || []), logEntry(act)] }; }
  S[c][id] = deepMerge(S[c][id], p); render();
  try { await withRetry(() => store.update(c, id, p)); return true; }
  catch (e) {
    if (offline && isTransient(e)) {
      queue.push({ c, id, p }); ls.set('meguru.queue', queue);
      toast('通信が不安定なため、記録を端末に保存しました。つながり次第送信します。');
      return true;
    }
    toast(errMsg(e)); return false;
  }
}
async function put(c, id, d) {
  try { await withRetry(() => store.set(c, id, d)); return true; } catch (e) { toast(errMsg(e)); return false; }
}
async function remove(c, id) {
  try { await withRetry(() => store.del(c, id)); return true; } catch (e) { toast(errMsg(e)); return false; }
}
let flushing = false;
async function flushQueue() {
  if (flushing || !queue.length || !store) return;
  flushing = true;
  while (queue.length) {
    const q = queue[0];
    try { await store.update(q.c, q.id, q.p); queue.shift(); ls.set('meguru.queue', queue); }
    catch (e) { if (isTransient(e)) break; queue.shift(); ls.set('meguru.queue', queue); toast(errMsg(e)); }
  }
  flushing = false; scheduleRender();
}
setInterval(flushQueue, 15000);
window.addEventListener('online', flushQueue);

/* ---- 地区の地図(地点の位置関係の略図と、選んだ車両のその日のルート) ---- */
function vehicleDayStops(v, date) {
  const past = [];
  Object.values(S.requests).filter(r => r.vehicleId === v.id && r.date === date).forEach(r => {
    if (r.ev?.boardedAt) past.push({ t: isoToMin(r.ev.boardedAt), place: r.pickupPlaceId });
    if (r.ev?.droppedAt) past.push({ t: isoToMin(r.ev.droppedAt), place: r.destPlaceId });
  });
  past.sort((a, b) => a.t - b.t);
  const route = routeOf(v, date), sim = simulate(route, route.seq);
  const future = route.seq.map(s => ({ t: s.kind === 'pick' ? sim.info[s.id].pick : sim.info[s.id].drop, place: s.place, kind: s.kind, r: S.requests[s.id] }));
  return { start: route.start, past, future };
}
function projector(ps, W, H, pad) {
  const lat0 = ps.reduce((s, p) => s + p.lat, 0) / ps.length, kx = Math.cos(lat0 * Math.PI / 180);
  const xs = ps.map(p => p.lng * kx), ys = ps.map(p => p.lat);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const sc = Math.min((W - 2 * pad) / ((maxX - minX) || 1), (H - 2 * pad) / ((maxY - minY) || 1));
  const ox = (W - (maxX - minX) * sc) / 2, oy = (H - (maxY - minY) * sc) / 2;
  return p => [Math.round(((p.lng * kx - minX) * sc + ox) * 10) / 10, Math.round((H - ((p.lat - minY) * sc + oy)) * 10) / 10];
}
function mapCard() {
  const ps = Object.values(S.places).filter(p => isFinite(p.lat) && isFinite(p.lng));
  const vs = Object.values(S.vehicles).sort((a, b) => a.name.localeCompare(b.name, 'ja'));
  if (ps.length < 2 || !vs.length) return '';
  const date = UI.date;
  if (!S.vehicles[UI.mapV]) UI.mapV = (vs.find(v => Object.values(S.requests).some(r => r.vehicleId === v.id && r.date === date && ACTIVE.includes(r.status))) || vs[0]).id;
  const v = S.vehicles[UI.mapV], W = 600, H = 300, P = projector(ps, W, H, 30);

  const { start, past, future } = vehicleDayStops(v, date);
  const pathOf = pts => pts.filter(Boolean).filter((p, i, a) => !i || p[0] !== a[i - 1][0] || p[1] !== a[i - 1][1]).map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ');

  const hit = b => boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]);
  if (sel) [sel.pickupPlaceId, sel.destPlaceId].map(at).filter(Boolean).forEach(q => boxes.push([q[0] - 11, q[1] - 11, q[0] + 11, q[1] + 11]));

      const cand = [[x + 7, y - 5, 'start'], [x - 7, y - 5, 'end'], [x + 7, y + 13, 'start'], [x - 7, y + 13, 'end'], [x + 7, y - 18, 'start']];
      const box = ([tx, ty, a]) => a === 'start' ? [tx, ty - 10, tx + w, ty + 2] : [tx - w, ty - 10, tx, ty + 2];
      const c = cand.find(c => { const b = box(c); return b[0] >= 0 && b[2] <= W && !hit(b); }) || cand[0];

    }

  }).join('');

  }).join('');

  }
  return `<div class="card map-card"><div class="map-h"><h3>地図 ・ ${esc(dateLabel(date))}</h3>
      <div class="vchips" role="group" aria-label="ルートを表示する車両">${vs.map(x => `<button data-act="mapv" data-v="${esc(x.id)}" aria-pressed="${x.id === v.id}">${esc(x.name)}</button>`).join('')}</div></div>
    <svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(v.name)}の${esc(dateLabel(date))}のルートの略図">
      ${pastPath ? `<path class="past" d="${pastPath}"></path>` : ''}${nextPath && future.length ? `<path class="next" d="${nextPath}"></path>` : ''}
      ${dots}${reqMarks}${stops}</svg>
    <div class="map-legend"><span><i style="background:var(--ink-soft);opacity:.5"></i>完了した区間</span><span><i style="background:var(--c-solo)"></i>これからのルート(番号は停車順)</span>${sel ? '<span><i style="background:var(--c-share)"></i>選択中の依頼</span>' : ''}<span>□ 車両の拠点</span><span>地点の位置関係を示す略図です(道路は表示していません)</span></div>
  </div>`;
}

/* ---- 日ごとの推移(実績・効果検証) ---- */
function dailySeries(reqs) {

}

function chartsHtml(reqs, baseline) {

  // 座席稼働率(1系列の折れ線 + 導入前の基準線)
  const top = Math.max(0.1, Math.ceil(Math.max(...ds.map(d => d.occ || 0), baseline || 0) * 10) / 10);
  const y1 = v => T + ih - v / top * ih;
  const grid1 = [0, top / 2, top].map(v => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y1(v)}" y2="${y1(v)}"></line><text class="ax" x="${L - 6}" y="${y1(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`).join('');
  const pts = ds.map((d, i) => [cx(i), y1(d.occ || 0)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = `${line} L${pts[pts.length - 1][0].toFixed(1)} ${y1(0)} L${pts[0][0].toFixed(1)} ${y1(0)} Z`;
  const last = ds[ds.length - 1], lp = pts[pts.length - 1];
  const ref = baseline != null ? `<line class="ref" x1="${L}" x2="${W - R}" y1="${y1(baseline)}" y2="${y1(baseline)}"></line><text class="ax" x="${W - R + 6}" y="${y1(baseline) + 4}">導入前 ${Math.round(baseline * 100)}%</text>` : '';
  const hits1 = ds.map((d, i) => `<g><title>${md(d.date)} 座席稼働率 ${pct(d.occ)}(完了${d.done}件)</title><rect class="hit" x="${cx(i) - step / 2}" y="${T}" width="${step}" height="${ih}"></rect></g>`).join('');
  const c1 = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="日ごとの座席稼働率">${grid1}${ref}<path class="ar" d="${area}"></path><path class="ln" d="${line}"></path>
    ${pts.map(p => `<circle class="dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4"></circle>`).join('')}
    <text class="val" x="${lp[0] + 8}" y="${lp[1] - 8}">${pct(last.occ)}</text>${xlab}${hits1}</svg>`;
  // 完了件数(単独 / 乗合 の積み上げ)
  const maxN = Math.max(...ds.map(d => d.done)), topN = Math.max(10, Math.ceil(maxN / 10) * 10);
  const y2 = v => T + ih - v / topN * ih, bw = Math.min(24, step * 0.6);
  const grid2 = [0, topN / 2, topN].map(v => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y2(v)}" y2="${y2(v)}"></line><text class="ax" x="${L - 6}" y="${y2(v) + 4}" text-anchor="end">${v}</text>`).join('');

  }).join('');
  const lastBarTop = y2(last.done);
  const c2 = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="日ごとの完了件数(単独と乗合)">${grid2}${bars}<text class="val" x="${cx(ds.length - 1)}" y="${lastBarTop - 6}" text-anchor="middle">${last.done}</text>${xlab}</svg>`;
  const table = `<details class="ex" style="margin-top:6px"><summary>日ごとの数値を表で見る</summary><div class="tbl-wrap"><table><thead><tr><th>日付</th><th class="num">座席稼働率</th><th class="num">完了</th><th class="num">うち乗合</th></tr></thead><tbody>${ds.map(d => `<tr><td>${md(d.date)}</td><td class="num">${pct(d.occ)}</td><td class="num">${d.done}</td><td class="num">${d.shared}</td></tr>`).join('')}</tbody></table></div></details>`;
  return `<div class="charts">
    <div class="card"><h3>日ごとの座席稼働率</h3><p class="hint" style="margin:-6px 0 4px">点に触れると、その日の値が出ます。</p>${c1}</div>
    <div class="card"><h3>日ごとの完了件数</h3><div class="legend"><span><i style="background:var(--c-solo)"></i>単独</span><span><i style="background:var(--c-share)"></i>乗合</span></div>${c2}${table}</div>
  </div>`;
}

/* ---- 実績・効果検証 ---- */
function periodReqs() {
  const t = todayStr();
  return Object.values(S.requests).filter(r => UI.period === 'today' ? r.date === t : UI.period === '7d' ? r.date >= addDays(t, -6) && r.date <= t : true);
}
function kpi(reqs) {
  const done = reqs.filter(r => r.status === 'done' && r.ev?.boardedAt && r.ev?.droppedAt);
  const B = r => Date.parse(r.ev.boardedAt), D = r => Date.parse(r.ev.droppedAt);
  const sharedSet = new Set(done.filter(a => done.some(b => b !== a && b.vehicleId === a.vehicleId && B(b) < D(a) && B(a) < D(b))).map(r => r.id));
  const offers = reqs.flatMap(r => r.offers || []);
  const declines = offers.filter(o => o.result === 'declined').length;
  const answered = offers.filter(o => o.result === 'accepted' || o.result === 'declined').length;
  const groups = {};
  done.forEach(r => { const k = r.vehicleId + '|' + r.date; (groups[k] = groups[k] || []).push(r); });
  const perV = {};
  let used = 0, cap = 0;
  Object.entries(groups).forEach(([k, rs]) => {
    const v = S.vehicles[rs[0].vehicleId]; const capacity = +v?.capacity || 4;
    // 乗車中の時間 = 誰か1人でも乗っている時間(乗車〜降車の区間を重ね合わせた長さ)
    const iv = rs.map(r => [B(r), D(r)]).sort((a, b) => a[0] - b[0]);
    let busy = 0, [cs, ce] = iv[0];
    for (const [s0, e0] of iv.slice(1)) { if (s0 > ce) { busy += ce - cs; cs = s0; ce = e0; } else ce = Math.max(ce, e0); }
    busy = (busy + ce - cs) / 60000;
    const u = rs.reduce((s, r) => s + (+r.party || 1) * (D(r) - B(r)), 0) / 60000;
    const c = capacity * busy;
    used += u; cap += c;
    const p = perV[rs[0].vehicleId] = perV[rs[0].vehicleId] || { trips: 0, pax: 0, mins: 0, used: 0, cap: 0, shared: 0 };
    p.trips += rs.length; p.pax += rs.reduce((s, r) => s + (+r.party || 1), 0); p.mins += busy; p.used += u; p.cap += c;
    p.shared += rs.filter(r => sharedSet.has(r.id)).length;
  });
  const est = reqs.filter(r => r.estAddMin != null && ['accepted', 'onboard', 'done'].includes(r.status));
  // 導入前の座席稼働率(車両ごとに登録)との比較。今回の分母(定員×稼働時間)で重み付けする
  let bW = 0, bSum = 0;
  Object.entries(perV).forEach(([vid, p]) => { const b = S.vehicles[vid]?.baselineOcc; if (b !== '' && b != null && !isNaN(b)) { bW += p.cap; bSum += p.cap * b / 100; } });
  const svs = reqs.map(r => S.surveys[r.id]).filter(Boolean);
  return {
    baseline: bW ? bSum / bW : null,
    surveys: svs.length,
    satisfaction: svs.length ? svs.reduce((s, x) => s + (+x.satisfaction || 0), 0) / svs.length : null,
    easierRate: svs.length ? svs.filter(x => x.easier === 'yes').length / svs.length : null,
    total: reqs.filter(r => r.status !== 'cancelled').length,
    matched: reqs.filter(r => ['accepted', 'onboard', 'done'].includes(r.status)).length,
    done: done.length, shared: sharedSet.size,
    taxi: reqs.filter(r => r.status === 'taxi').length,
    noshow: reqs.filter(r => r.status === 'noshow').length,
    occ: cap ? used / cap : null,
    declineRate: answered ? declines / answered : null,
    avgAdd: est.length ? est.reduce((s, r) => s + r.estAddMin, 0) / est.length : null,
    perV, sharedSet,
  };
}
const pct = x => x == null ? '—' : Math.round(x * 100) + ' %';

    <div class="card"><h3>車両別</h3>${per.length ? `<div class="tbl-wrap"><table><thead><tr><th>車両</th><th>事業者</th><th class="num">完了</th><th class="num">乗車人数</th><th class="num">乗合</th><th class="num">乗車中の時間</th><th class="num">座席稼働率</th><th class="num">導入前</th></tr></thead><tbody>
      ${per.map(([vid, p]) => { const b = S.vehicles[vid]?.baselineOcc; return `<tr><td>${esc(vName(vid))}</td><td>${esc(S.vehicles[vid]?.owner || '')}</td><td class="num">${p.trips}</td><td class="num">${p.pax}</td><td class="num">${p.shared}</td><td class="num">${Math.round(p.mins)}分</td><td class="num">${pct(p.cap ? p.used / p.cap : null)}</td><td class="num">${b === '' || b == null ? '未登録' : esc(b) + ' %'}</td></tr>`; }).join('')}
      </tbody></table></div>` : `<p class="empty">この期間に完了した乗車はまだありません。</p>`}
      <div class="formula">座席稼働率 = Σ(乗車人数 × 乗車時間) ÷ Σ(定員 × 乗車中の時間)。人を乗せて走っている間に、座席がどれだけ埋まっているかを表します(定員4の車に1人なら25%、乗合で2人なら50%)。乗車中の時間は、その車両に1人でも乗っている時間の合計です。導入前の値と比べるときは、参加前の運行記録も同じ式で集計してください。</div>
      ${UI.csv ? `<p class="hint">ダウンロードできない環境のため、下の内容をコピーして表計算ソフトに貼り付けてください。</p><textarea class="csv" id="f-csv" readonly>${esc(UI.csv)}</textarea>` : ''}
    </div>`;
}

function readCsvFile(file) {
  const fr = new FileReader();
  fr.onload = () => {
    const buf = new Uint8Array(fr.result);
    let t = new TextDecoder('utf-8').decode(buf);
    if (t.includes(String.fromCharCode(0xFFFD))) { try { t = new TextDecoder('shift_jis').decode(buf); } catch (e) {} }
    UI.imp.text = t; UI.imp.progress = ''; render();
  };
  fr.readAsArrayBuffer(file);
}

async function runCleanup(kind) {
  let n = 0;
  for (const id of Object.keys(S.riders)) if (await remove('riders', id)) n++;
  if (kind === 'anon') {
    for (const r of Object.values(S.requests)) if (r.pickupDetail || r.care || r.riderId) await patch('requests', r.id, { pickupDetail: '', care: '', riderId: '', log: (r.log || []).map(l => ({ at: l.at, act: l.act })) });
    for (const s of Object.values(S.surveys)) if (s.comment || s.riderId) await patch('surveys', s.id, { comment: '', riderId: '' });
  } else {
    for (const id of Object.keys(S.requests)) await remove('requests', id);
    for (const id of Object.keys(S.surveys)) await remove('surveys', id);
  }
  return n;
}

/* ============ 運転手への新着通知(音・振動) ============
   ブラウザは画面に一度触れるまで音を鳴らせないため、最初のタップで音声を準備する */
let seenOffers = null, audioCtx = null;
const soundOn = () => ls.get('meguru.sound', true);
function ensureAudio() {
  if (audioCtx || !soundOn()) return;
  try { const A = window.AudioContext || window.webkitAudioContext; if (A) audioCtx = new A(); } catch (e) {}
}
function chime() {
  try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
  if (!audioCtx || !soundOn()) return;
  try {
    audioCtx.resume && audioCtx.resume();
    [0, 0.35, 0.7].forEach((t, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), s = audioCtx.currentTime + t;
      o.frequency.value = i === 2 ? 1046 : 784; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.4, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.3);
      o.start(s); o.stop(s + 0.32);
    });
  } catch (e) {}
}
function checkNewOffers() {
  if (!(UI.role === 'driver' || splitOn()) || !UI.myVehicle) { seenOffers = null; return; }
  const ids = Object.values(S.requests).filter(r => r.vehicleId === UI.myVehicle && r.status === 'offered').map(r => r.id);
  if (seenOffers === null) { seenOffers = new Set(ids); return; }
  const fresh = ids.filter(i => !seenOffers.has(i));
  seenOffers = new Set(ids);
  if (fresh.length) { chime(); UI.drvTab = 'req'; toast('新しい配車依頼が届きました。'); }
}
/* 運転中に画面が消えると新着に気づけないため、運転手画面では画面の消灯を防ぐ(端末が許可した場合のみ) */
let wakeLock = null;
async function keepScreenOn() {
  if (UI.role !== 'driver' || wakeLock || !navigator.wakeLock) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (e) {}
}
document.addEventListener('pointerdown', () => { ensureAudio(); keepScreenOn(); }, true);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepScreenOn(); });

/* ============ 描画 ============ */
function render() {
  const app = document.getElementById('app');
  const a = document.activeElement, fid = a && a.id, sel = a && 'selectionStart' in a ? [a.selectionStart, a.selectionEnd] : null;
  let body;
  if (MODE === 'connecting') body = `<div class="wrap"><p class="empty">共有データに接続しています…</p></div>`;
  else if (UI.role === 'operator' && CAN.operator) body = splitOn() ? `<div class="split"><div class="split-main">${operatorView()}</div><aside class="split-phone" aria-label="運転手のスマホ画面">${driverView(true)}</aside></div>` : operatorView();
  else body = driverView();
  app.innerHTML = header() + body + tourBox() + (UI.toast ? `<div class="toast${UI.tour ? ' up' : ''}" role="status" data-act="toast-x">${esc(UI.toast)}</div>` : '');
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
}
let pending = false;
function scheduleRender() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#app') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox') { pending = true; return; }
  if (renderQueued) return;
  renderQueued = true; setTimeout(() => { renderQueued = false; render(); }, 16);
}
let renderQueued = false;
document.addEventListener('focusout', () => { if (pending) setTimeout(() => { const a = document.activeElement; if (!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) { pending = false; render(); } }, 0); });
setInterval(() => { if (MODE !== 'connecting') scheduleRender(); }, 60000);

};

  'pick-vehicle'(d) { UI.myVehicle = d.v; ls.set('meguru.vehicle', d.v); UI.drvTab = 'req'; seenOffers = null; checkNewOffers(); render(); },
  'change-vehicle'() { UI.myVehicle = null; ls.set('meguru.vehicle', null); seenOffers = null; render(); },
  sound() { const on = !soundOn(); ls.set('meguru.sound', on); if (on) { ensureAudio(); chime(); } render(); },
  async avail() { const v = S.vehicles[UI.myVehicle]; await patch('vehicles', v.id, { available: v.available === false }); },
  async accept(d) {
    const r = S.requests[d.id];
    await patch('requests', r.id, { status: 'accepted', offers: lastOfferPatch(r, 'accepted'), ev: { acceptedAt: nowIso() } }, { offline: true });
    toast('承諾しました。運営者から利用者へ確定の連絡が入ります。');
  },
  'decline-open'(d) { UI.declining = d.id; render(); },
  'decline-cancel'() { UI.declining = null; render(); },
  async decline(d) {
    const r = S.requests[d.id]; UI.declining = null;
    await patch('requests', r.id, { status: 'declined', vehicleId: null, offers: lastOfferPatch(r, 'declined', { reason: d.v }) }, { offline: true });
    toast('辞退しました。運営者が次の候補車両へ依頼を回します。');
  },
  async arrived(d) { await patch('requests', d.id, { ev: { arrivedAt: nowIso() } }, { offline: true }); },
  async boarded(d) { await patch('requests', d.id, { status: 'onboard', ev: { boardedAt: nowIso() } }, { offline: true }); toast('乗車を記録しました。'); },
  async dropped(d) { await patch('requests', d.id, { status: 'done', ev: { droppedAt: nowIso() } }, { offline: true }); toast('降車を記録しました。お疲れさまでした。'); },
  async noshow(d) { UI.confirm = null; await patch('requests', d.id, { status: 'noshow', noshowNote: '到着したが乗車なし', ev: { noshowAt: nowIso() } }, { offline: true }); toast('運営者に報告しました。'); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if (fn) { e.preventDefault(); fn(b.dataset, b); }
});
document.addEventListener('input', e => onField(e.target, false));
document.addEventListener('change', e => onField(e.target, true));
function onField(el, commit) {
  if (el.id === 'imp-file') { if (commit && el.files && el.files[0] && UI.imp) readCsvFile(el.files[0]); return; }
  if (el.dataset.imp) { if (UI.imp) { UI.imp.text = el.value; if (commit) render(); } return; }
  if (el.dataset.bind) {
    const k = el.dataset.bind, f = UI.form;
    f[k] = el.type === 'checkbox' ? el.checked : el.value;
    if (k === 'riderId' && commit) {
      const r = S.riders[el.value];
      if (r) Object.assign(f, { pickupPlaceId: r.homePlaceId || '', pickupDetail: r.homeDetail || '', care: r.care || '', wheelchair: !!r.wheelchair });
      render();
    } else if ((commit && el.tagName === 'SELECT') || el.dataset.live) render();
  } else if (el.dataset.ui && commit) {
    UI[el.dataset.ui] = el.value; UI.csv = ''; render();
  } else if (el.dataset.k && UI.edit) {
    UI.edit.data[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value;
  } else if (el.dataset.k && el.closest('[data-coll="settings"]')) {
    UI.edit = { coll: 'settings', id: 'main', data: { ...cfg(), [el.dataset.k]: el.type === 'checkbox' ? el.checked : el.value } };
  }
}
document.addEventListener('submit', async e => {
  const form = e.target; e.preventDefault();
  if (form.dataset.form === 'recv') return submitReception();
  if (form.dataset.form === 'edit') return submitEdit(form);
  if (form.dataset.form === 'survey') return saveSurvey(form.dataset.id, {
    satisfaction: +form.querySelector('#sv-sat').value, easier: form.querySelector('#sv-easier').value, comment: form.querySelector('#sv-comment').value.trim(),
  });
});
async function saveSurvey(reqId, v) {
  const r = S.requests[reqId];
  const doc = { requestId: reqId, riderId: r.riderId, date: r.date, ...v, at: nowIso(), ...(r.sample ? { sample: true } : {}) };
  if (await put('surveys', reqId, doc)) { S.surveys[reqId] = { ...doc, id: reqId }; UI.survey = null; toast('アンケートを記録しました。'); }
}
async function submitReception() {
  const f = UI.form;
  const r = S.riders[f.riderId];
  const missing = [!r && '利用者', !f.date && '日付', !f.time && 'お迎え希望時刻', !f.pickupPlaceId && '乗車地', !f.destPlaceId && '行き先'].filter(Boolean);
  if (missing.length) { f.err = `${missing.join('・')}を入力してください。`; return render(); }
  if (f.pickupPlaceId === f.destPlaceId) { f.err = '乗車地と行き先が同じです。'; return render(); }
  const n = +f.repeat || 0, group = n ? newId('g') : null;
  const docs = Array.from({ length: n + 1 }, (_, k) => [newId('q'), {
    riderId: r.id, riderNo: r.no, date: addDays(f.date, 7 * k), pickupTime: f.time, pickupPlaceId: f.pickupPlaceId, pickupLabel: pName(f.pickupPlaceId),
    pickupDetail: f.pickupDetail, destPlaceId: f.destPlaceId, destLabel: pName(f.destPlaceId), party: +f.party || 1, care: f.care,
    wheelchair: !!f.wheelchair, status: 'new', vehicleId: null, offers: [], ev: {}, riderNotified: false, createdAt: nowIso(), log: [logEntry('電話受付')],
    ...(group ? { repeatGroup: group, repeatIndex: k + 1, repeatTotal: n + 1 } : {}),
    ...(hasDemo() ? { sample: true } : {}), // デモ中の受付は、デモを作り直すと一緒に消える
  }]);
  docs.forEach(([id, doc]) => S.requests[id] = { ...doc, id });
  UI.sel = docs[0][0]; UI.date = f.date; UI.filter = 'need'; UI.form = blankForm(); UI.form.date = f.date;
  render();
  for (const [id, doc] of docs) if (!(await put('requests', id, doc))) { delete S.requests[id]; break; }
  if (n) toast(`${n + 1}回分(${dateLabel(docs[0][1].date)}〜${dateLabel(docs[n][1].date)})を受け付けました。配車は各日に行います。`);
}
async function submitEdit(form) {
  const coll = form.dataset.coll, sc = SCHEMA[coll];
  const data = {};
  for (const fd of sc.fields) {
    const el = form.querySelector(`[data-k="${fd.k}"]`);
    let v = fd.type === 'bool' ? el.checked : el.value.trim();
    if (fd.type === 'num' && v !== '') v = Number(v);
    if (fd.req && (v === '' || v == null || (fd.type === 'num' && isNaN(v)))) {
      UI.edit = { coll, id: form.dataset.id || null, data: { ...(UI.edit?.data || {}), ...data }, err: `「${fd.l}」を入力してください。` };
      return render();
    }
    data[fd.k] = v;
  }
  if (coll === 'riders' && Object.values(S.riders).some(x => x.no === data.no && x.id !== form.dataset.id)) {
    UI.edit = { coll, id: form.dataset.id || null, data, err: 'この利用者番号はすでに使われています。' }; return render();
  }
  if (coll === 'vehicles' && (data.capacity < 1 || data.capacity > 30)) { UI.edit = { coll, id: form.dataset.id || null, data, err: '定員は1〜30で入力してください。' }; return render(); }
  const id = coll === 'settings' ? 'main' : (form.dataset.id || newId(coll[0]));
  const prev = S[coll][id] || {};
  const full = { ...prev, ...data }; delete full.id;
  if (form.dataset.id && prev.sample) full.sample = true;
  if (await put(coll, id, full)) { UI.edit = null; toast('保存しました。'); }
}

/* ============ 2画面表示と自動デモ ============
   2画面: 横幅の広い画面では、オペレーター画面の右に運転手のスマホ画面を並べる(売り込みのデモ用)。
   自動デモ: 電話受付から実績までを字幕つきで自動で進める。共有データは変えず、この画面の中だけの体験モードで動く。 */
const isWide = () => (window.innerWidth || 0) >= 1280;
const splitOn = () => !!UI.split && isWide() && UI.role === 'operator' && CAN.operator;
let SANDBOX = null; // 体験モード中は、元のデータ保存層と権限を退避しておく
function enterSandbox() {
  if (SANDBOX) return;
  SANDBOX = { store, MODE, CAN: { ...CAN }, role: UI.role };
  store = memStore(seedData(todayStr(), currentPreset())); CAN.operator = true; CAN.write = true;
  subscribeAll();
}
function leaveSandbox() {
  if (!SANDBOX) return;
  store = SANDBOX.store; Object.assign(CAN, SANDBOX.CAN); UI.role = CAN.operator ? SANDBOX.role : 'driver';
  SANDBOX = null; UI.sel = null; UI.form = blankForm();
  subscribeAll();
}
const wait = ms => new Promise(r => setTimeout(r, ms));
/* 自動デモの電話: 体験の入口の依頼(q_demo_a)と同じ地区・同じ行き先の方にして、乗合が見られるようにする */
function tourPlan() {
  const a = S.requests.q_demo_a, rs = Object.values(S.riders).filter(r => !r.wheelchair && (!a || r.id !== a.riderId));
  const r = (a && rs.find(x => x.homePlaceId === a.pickupPlaceId)) || rs[0];
  return r ? { r, dest: a ? a.destPlaceId : Object.keys(S.places).find(id => S.places[id].kind === 'hospital'), time: '10:45' } : null;
}
const TOUR = [
  { t: () => { const p = tourPlan(); return p ? `電話が入りました。${pName(p.r.homePlaceId)}の${p.r.name}さんから「10時45分に、${pName(p.dest)}へ行きたいのですが」。` : '電話が入りました。'; }, ms: 4200, run: () => {
    const p = tourPlan(); if (!p) return; const r = p.r;
    UI.role = 'operator'; UI.opTab = 'board'; UI.date = todayStr(); UI.filter = 'all'; UI.sel = null;
    UI.form = Object.assign(blankForm(), { riderId: r.id, pickupPlaceId: r.homePlaceId, pickupDetail: r.homeDetail, care: r.care, wheelchair: !!r.wheelchair, time: p.time, destPlaceId: p.dest });
  } },
  { t: '受け付けると、参加している全車両の予定・空席・時間帯から、乗せられる車が自動で並びます。追加時間・乗合・お迎え時刻を比べて、人が選びます。', ms: 6500, run: async () => {
    await submitReception();
    UI.tourReq = UI.sel;
  } },
  { t: 'いちばん負担の少ない車に依頼します。依頼はその車の運転手のスマホに届きます。', ms: 4200, run: async () => {
    const req = S.requests[UI.tourReq], best = candidates(req).ok[0];
    if (!best) return;
    UI.tourV = best.v.id; UI.myVehicle = best.v.id; UI.drvTab = 'req'; UI.mapV = best.v.id;
    if (!isWide()) UI.role = 'driver';
    seenOffers = null; checkNewOffers();
    await ACT.offer({ id: req.id, v: best.v.id });
  } },
  { t: '運転手は、乗車地・行き先・配慮事項を見て「承諾する」を押します。利用者の氏名や電話番号は、運転手には表示されません。', ms: 5200, run: async () => {
    await wait(1500); await ACT.accept({ id: UI.tourReq });
  } },
  { t: '承諾されると、地図に新しい停車順が反映されます。オペレーターは利用者へ、お迎えの時刻を折り返し電話で伝えます。', ms: 5200, run: async () => {
    UI.role = 'operator'; UI.sel = null; UI.mapV = UI.tourV;
    await ACT.notified({ id: UI.tourReq });
  } },
  { t: '当日、運転手は到着・乗車・降車をボタンで記録します(ここでは早送りしています)。電波が届かない場所でも記録は残ります。', ms: 5600, run: async () => {
    UI.drvTab = 'run'; if (!isWide()) UI.role = 'driver';
    await wait(900); await ACT.arrived({ id: UI.tourReq });
    await wait(900); await ACT.boarded({ id: UI.tourReq });
    await wait(1200); await ACT.dropped({ id: UI.tourReq });
  } },
  { t: '記録はすぐに実績へ反映されます。座席稼働率・乗合の件数・満足度を、日ごとの推移と一緒にそのまま報告に使えます(数字は架空のデモデータです)。', ms: 6500, run: () => {
    UI.role = 'operator'; UI.opTab = 'kpi'; UI.period = '7d'; UI.drvTab = 'req';
  } },
  { t: '自動デモはここまでです。このまま自由に操作できます。この画面の中だけの体験なので、共有データは変わりません。', ms: 0, run: () => { UI.opTab = 'board'; } },
];
let tourTimer = null, tourRunning = false;
async function tourGo(i) {
  if (!UI.tour) return;
  clearTimeout(tourTimer);
  UI.tour.step = i; tourRunning = true; render();
  try { await TOUR[i].run(); } catch (e) {}
  tourRunning = false; render();
  if (UI.tour && UI.tour.playing && TOUR[i].ms && i < TOUR.length - 1) tourTimer = setTimeout(() => tourGo(i + 1), TOUR[i].ms);
}
function tourStart() {
  ensureAudio();
  enterSandbox();
  UI.split = true; ls.set('meguru.split', true);
  UI.tour = { step: 0, playing: true };
  setTimeout(() => tourGo(0), 50);
}
function tourBox() {
  if (!UI.tour) return '';
  const i = UI.tour.step, last = i === TOUR.length - 1;
  return `<div class="tour" role="dialog" aria-label="自動デモ" aria-live="polite">
    <div class="tour-h"><span class="mono">自動デモ ${i + 1}/${TOUR.length}</span><div class="tour-bar"><i style="width:${(i + 1) / TOUR.length * 100}%"></i></div></div>
    <p>${esc(typeof TOUR[i].t === 'function' ? TOUR[i].t() : TOUR[i].t)}</p>
    <div class="row-btns">${last ? `<button class="btn btn-gold btn-sm" data-act="tour-restart">最初から見る</button><button class="btn btn-ghost btn-sm" data-act="tour-close">字幕を閉じる</button>`
      : `<button class="btn btn-ghost btn-sm" data-act="tour-pause">${UI.tour.playing ? '一時停止' : '再開'}</button><button class="btn btn-gold btn-sm" data-act="tour-next" ${tourRunning ? 'disabled' : ''}>次へ</button><button class="btn btn-ghost btn-sm" data-act="tour-close">終了</button>`}</div>
  </div>`;
}
Object.assign(ACT, {
  'tour-start'() { tourStart(); },
  'tour-next'() { if (!tourRunning && UI.tour) tourGo(Math.min(UI.tour.step + 1, TOUR.length - 1)); },
  'tour-pause'() { if (!UI.tour) return; UI.tour.playing = !UI.tour.playing; clearTimeout(tourTimer); if (UI.tour.playing && !tourRunning) tourTimer = setTimeout(() => tourGo(UI.tour.step + 1), 1500); render(); },
  'tour-close'() { clearTimeout(tourTimer); UI.tour = null; render(); },
  'tour-restart'() { clearTimeout(tourTimer); leaveSandbox(); tourStart(); },
  'sandbox-end'() { clearTimeout(tourTimer); UI.tour = null; leaveSandbox(); toast('体験を終えました。共有データの画面に戻りました。'); },
  split() { UI.split = !UI.split; ls.set('meguru.split', UI.split); if (UI.split && !UI.myVehicle) { const v = Object.values(S.vehicles)[0]; if (v) UI.myVehicle = v.id; } seenOffers = null; checkNewOffers(); render(); },
});
window.addEventListener('resize', () => { if (UI.split) scheduleRender(); });

/* デモの作り直し用: 中身が同じか(画面用に付けた id は比べない)、同時に何件まで書き込むか */
const canon = v => Array.isArray(v) ? v.map(canon) : v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).filter(k => k !== 'id').sort().map(k => [k, canon(v[k])])) : v;
const sameDoc = (a, b) => !!a && JSON.stringify(canon(a)) === JSON.stringify(canon(b));
async function runPool(jobs, size, onDone) {
  let next = 0;
  const worker = async () => { while (next < jobs.length) { const job = jobs[next++]; let ok = false; try { ok = await job(); } catch (e) { ok = false; } onDone(ok !== false); } };
  await Promise.all(Array.from({ length: Math.min(size, jobs.length) }, worker));
}

/* ============ 起動 ============ */
function onData(c, o) {
  const out = {};
  for (const id in o) out[id] = { ...o[id], id };
  for (const q of queue) if (q.c === c && out[q.id]) out[q.id] = deepMerge(out[q.id], q.p);
  S[c] = out; loaded.add(c);
  if (c === 'requests') checkNewOffers();
  scheduleRender();
}
async function boot() {
  render();
  let db = null, user = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch (e) {}
  }
  if (db) {
    store = dbStore(db); MODE = 'live'; USER = user;
    ME = user ? await user.id() : null;
    CAN.operator = user ? await user.canEdit() : false;
    const w = user ? await user.can('data.write') : null;
    CAN.write = w !== false;
  } else {
    store = memStore(seedData(todayStr())); MODE = 'demo'; CAN.operator = true;
  }
  if (!CAN.operator) UI.role = 'driver';
  else if (!UI.role) UI.role = 'operator';
  subscribeAll();
  render(); flushQueue();
  /* プレゼン用: ?tour=1 で自動デモを始める(PowerPoint への埋め込み・動画の撮影用) */
  try { if (new URLSearchParams(location.search).get('tour') === '1') setTimeout(tourStart, 800); } catch (e) {}
}
/* 購読: 体験モードへの切り替えで作り直すため、世代番号で古い購読の通知を捨てる */
let GEN = 0, UNSUBS = [];
function subscribeAll() {
  const g = ++GEN;
  UNSUBS.forEach(u => { try { u && u(); } catch (e) {} }); UNSUBS = [];
  COLLS.forEach(c => { S[c] = {}; loaded.delete(c); });
  const colls = ['vehicles', 'places', 'requests', 'settings'].concat(CAN.operator ? ['riders', 'surveys'] : []);
  colls.forEach(c => UNSUBS.push(store.watch(c, (o, meta) => { if (g !== GEN) return; if (meta) UI.cached = meta.fromCache; onData(c, o); },
    () => { if (g === GEN) toast('データの受信が止まりました。ページを再読み込みしてください。'); })));
}
boot();
</script>
